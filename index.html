<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alhambra 3D Walkthrough · Roadrunners Realty</title>
  <meta name="description" content="Follow a tour guide through a 3D model of the Alhambra Palace in Granada, Spain.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="3D model of the Alhambra with a tour guide walking the route"></canvas>

  <div id="loading" class="loading">
    <svg width="72" height="32" viewBox="0 0 72 32" aria-hidden="true"><path d="M2 30 L22 8 L32 18 L46 2 L70 30" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>
    <p id="loading-text">Building the Alhambra…</p>
  </div>

  <header class="hud-top">
    <a class="brand" href="../" title="Back to the 2D floor-plan tour">
      <svg width="44" height="20" viewBox="0 0 72 32" aria-hidden="true"><path d="M2 30 L22 8 L32 18 L46 2 L70 30" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M22 8 L30 30 M46 2 L52 30" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>ROADRUNNERS</span>
    </a>
    <ol class="stops" id="stops" aria-label="Tour stops"></ol>
  </header>

  <aside class="card" id="card" aria-live="polite">
    <p class="eyebrow" id="card-eyebrow">3D WALKTHROUGH</p>
    <h1 id="card-title">The Alhambra</h1>
    <p class="sub" id="card-sub">Granada, Spain · Nasrid dynasty, 1238–1391</p>
    <ul class="chips" id="card-look"></ul>
    <p class="script" id="card-script">Press <b>Start tour</b> and our guide will walk you from the council hall to the summer gardens, stopping at six rooms.</p>
    <div class="controls">
      <button class="btn" id="btn-prev" title="Previous stop (←)">←</button>
      <button class="btn primary" id="btn-main">Start tour</button>
      <button class="btn" id="btn-next" title="Next stop (→)">→</button>
      <button class="btn ghost" id="btn-cam" title="Drag to look around (C)">Free look</button>
    </div>
    <label class="auto"><input type="checkbox" id="auto" checked> Auto-continue after each stop</label>
  </aside>

  <p class="hint" id="hint">Drag to look around · scroll to zoom</p>

  <script type="module" src="main.js"></script>
</body>
</html>
